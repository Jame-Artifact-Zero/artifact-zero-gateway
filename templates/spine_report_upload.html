<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cervical Spine Report Generator</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 560px;
      margin: 60px auto;
      background: white;
      padding: 32px 36px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
    }
    .desc {
      color: #555;
      font-size: 13px;
      margin: 0 0 22px 0;
    }
    .field {
      margin: 18px 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #333;
    }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      background: #fafafa;
      border-radius: 3px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 22px;
      background: #305496;
      color: white;
      border: 0;
      border-radius: 3px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #244075; }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status {
      display: none;
      margin: 20px 0 0 0;
      padding: 12px 14px;
      background: #fffae6;
      border: 1px solid #f0e0a0;
      color: #6b5f00;
      border-radius: 3px;
      font-size: 13px;
    }
    #status.visible { display: block; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #305496;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cervical Spine Report Generator</h1>
    <p class="desc">Upload a cervical spine MRI study as a .zip file. The server runs the k7 pipeline and returns a measurement report inline.</p>

    <form id="upload-form" method="POST" action="/spine_report" enctype="multipart/form-data">
      <div class="field">
        <label for="dicom">DICOM study (.zip)</label>
        <input type="file" id="dicom" name="dicom" accept=".zip,application/zip,application/x-zip-compressed" required>
      </div>
      <button type="submit" id="submit-btn">Generate Report</button>
    </form>

    <div id="status">
      <span class="spinner"></span>
      <span>Processing... this takes about 60 seconds</span>
    </div>
  </div>

  <script>
    document.getElementById('upload-form').addEventListener('submit', function () {
      document.getElementById('status').classList.add('visible');
      var btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Working...';
    });
  </script>
</body>
</html>
